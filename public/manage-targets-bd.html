<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ElevateMe — Manage BD Targets</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #080b14; --surface: #0f1322; --border: #1e2640;
    --text: #e8eaf6; --muted: #6b7499;
    --accent: #ff4d3a; --neon-green: #00e676;
  }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Nunito Sans', sans-serif; min-height: 100vh;
    background-image: radial-gradient(ellipse at 20% 10%, rgba(196,72,56,0.06) 0%, transparent 50%),
                      radial-gradient(ellipse at 80% 80%, rgba(0,230,118,0.04) 0%, transparent 50%);
  }
  header {
    background: #000; padding: 14px 24px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }
  .logo { display: flex; align-items: center; gap: 12px; }
  .logo-img { height: 36px; width: auto; display: block; }
  .logo-sub { font-size: 15px; font-weight: 400; color: #888; letter-spacing: 0.2px; }
  .header-right { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--muted); }
  .header-right img { width: 28px; height: 28px; border-radius: 50%; }
  .header-right strong { color: var(--text); }
  #btn-signout {
    background: none; border: 1px solid var(--border); color: var(--muted);
    border-radius: 8px; padding: 4px 12px; font-size: 12px; cursor: pointer;
  }
  #btn-signout:hover { border-color: var(--accent); color: var(--accent); }
  .nav-links { display: flex; gap: 8px; margin-right: 16px; flex-wrap: wrap; }
  .nav-btn {
    padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 700;
    border: 1px solid var(--border); color: var(--muted); text-decoration: none;
    transition: all 0.2s; background: none;
  }
  .nav-btn:hover { border-color: var(--accent); color: var(--accent); }
  .nav-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  #auth-overlay {
    position: fixed; inset: 0; z-index: 9999; background: #080b14;
    display: flex; align-items: center; justify-content: center;
  }
  .auth-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
    padding: 48px 40px; text-align: center; max-width: 380px; width: 90%;
  }
  .auth-logo { font-size: 24px; font-weight: 800; margin-bottom: 6px; }
  .auth-logo span { color: var(--accent); }
  .auth-sub { font-size: 13px; color: var(--muted); margin-bottom: 28px; }
  .auth-google-btn {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    width: 100%; padding: 14px; border-radius: 12px;
    background: #fff; color: #1a1a1a; font-size: 15px; font-weight: 700;
    border: none; cursor: pointer;
  }
  .auth-google-btn img { width: 20px; height: 20px; }
  .auth-error { margin-top: 14px; font-size: 13px; color: #ff4d6a; min-height: 18px; }

  .container { max-width: 900px; margin: 0 auto; padding: 32px 20px; }
  .page-header { margin-bottom: 24px; }
  .page-header h1 { font-size: 22px; font-weight: 800; }
  .page-header p { font-size: 13px; color: var(--muted); margin-top: 4px; }

  .month-row { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
  .month-row label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  .month-row input[type="month"] {
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text); padding: 9px 12px; border-radius: 8px; font-size: 14px;
    outline: none; color-scheme: dark;
  }
  .month-row input[type="month"]:focus { border-color: var(--accent); }
  .btn-save-all {
    background: var(--accent); color: #fff; border: none; padding: 9px 20px;
    border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer;
  }
  .btn-save-all:hover { box-shadow: 0 0 14px rgba(255,77,58,0.5); }
  .btn-save-all:disabled { opacity: 0.5; cursor: not-allowed; }

  .team-section { margin-bottom: 28px; }
  .team-title {
    font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px;
    margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--border);
  }

  .member-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; margin-bottom: 12px;
  }
  .member-top { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .avatar {
    width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0;
    background: rgba(255,255,255,0.07); display: flex; align-items: center;
    justify-content: center; font-size: 13px; font-weight: 800; color: var(--muted);
    border: 1.5px solid var(--border);
  }
  .member-name { font-size: 15px; font-weight: 700; }
  .role-badge {
    display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 7px;
    border-radius: 20px; border: 1px solid; margin-top: 2px; letter-spacing: 0.5px;
    color: #ffb84d; border-color: #ffb84d44; background: #ffb84d11;
  }

  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 10px; }
  .kpi-field label { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
  .kpi-field input {
    width: 100%; background: #111; border: 1px solid rgba(255,255,255,0.15); color: #fff;
    border-radius: 6px; padding: 7px 9px; font-size: 13px;
  }
  .kpi-field input:focus { outline: none; border-color: var(--accent); }

  .member-actions { display: flex; align-items: center; gap: 10px; }
  .btn-save {
    background: var(--accent); color: #fff; border: none; padding: 7px 16px;
    border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer;
  }
  .btn-save:hover { box-shadow: 0 0 14px rgba(255,77,58,0.5); }
  .btn-save:disabled { opacity: 0.5; cursor: not-allowed; }
  .save-status { font-size: 12px; color: var(--neon-green); display: none; }
  .save-status.show { display: inline; }
  .save-status.error { color: #ff4d6a; }

  .empty { color: var(--muted); font-size: 14px; padding: 40px 0; text-align: center; }

  @media (max-width: 768px) {
    header { padding: 10px 14px; flex-wrap: wrap; gap: 8px; }
    .nav-links { flex-wrap: wrap; margin-right: 0; }
  }
</style>
<!-- SUPERSEDED-REDIRECT: replaced by /manage-targets.html (unified targets + weightage) -->
<script>location.replace("/manage-targets.html" + location.hash);</script>
</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/config.js"></script>

<div id="auth-overlay">
  <div class="auth-card">
    <div class="auth-logo">Elevate<span>Me</span></div>
    <div class="auth-sub">Sign in to manage BD targets</div>
    <button class="auth-google-btn" id="btn-google-signin">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
      Sign in with Google
    </button>
    <div class="auth-error" id="auth-error"></div>
  </div>
</div>

<header>
  <div class="logo">
    <img src="/e92c4bab-2eb7-4e8f-bc76-e00992442f1f.png" alt="ElevateMe" class="logo-img">
    <span class="logo-sub">Manage BD Targets</span>
  </div>
  <div style="display:flex;align-items:center">
    <div class="nav-links" id="nav-links" style="display:none"></div>
    <div class="header-right" id="user-bar" style="display:none">
      <img id="user-avatar" src="" style="display:none">
      <strong id="user-name"></strong>
      <button id="btn-signout">Sign out</button>
    </div>
  </div>
</header>

<div class="container" id="main-content" style="display:none">
  <div class="page-header">
    <h1>Manage Monthly Targets — BD Team</h1>
    <p>Set each BDE's target per KPI for a specific month. Pick a month below — its saved targets (or last month's, as a starting point) will show.</p>
  </div>
  <div class="month-row">
    <label>Month</label>
    <input type="month" id="inp-month">
    <button class="btn-save-all" id="btn-save-all">Save All</button>
    <span class="save-status" id="status-save-all">Saved!</span>
  </div>
  <div id="teams-container"></div>
</div>

<script>
// SUPABASE_URL, SUPABASE_ANON, ALLOWED_EMAILS, ADMIN_EMAILS, SALES_TL_EMAILS,
// BD_TL_EMAILS, BD_PERSON_KEY_OVERRIDES/bdPersonKey, and buildNav() all come
// from /config.js.
const pkey = bdPersonKey;

const TEAMS = [
  {
    name: "LinkedIn Team", role: "LinkedIn BDE", leadEmail: "dhanraj.s@elevateme.pro",
    members: ["Ronak Khant", "Jiya Chandrawanshi", "Bhoomi Barot", "Heer Nakum"],
    kpis: [ { key:"ICP Moderate", dailyTarget: 4 }, { key:"ICP Cold", dailyTarget: 15 } ],
  },
  {
    name: "Portal Team", role: "Portal BDE", leadEmail: "dhanraj.s@elevateme.pro",
    members: ["Ajay Darbar", "Sunil Patel"],
    kpis: [ { key:"ICP Cold + Parser", dailyTarget: 120 } ],
  },
  {
    name: "Referral Team", role: "Referral BDE", leadEmail: "dhanraj.s@elevateme.pro",
    members: ["Meet Patel"],
    kpis: [ { key:"ICP Moderate", dailyTarget: 2 }, { key:"ICP Cold", dailyTarget: 10 }, { key:"Reference", dailyTarget: 1 } ],
  },
];
// Note: Heer Nakum and Ajay Darbar report to Prem Thakar day-to-day, but sit inside
// the LinkedIn/Portal team KPI structures above — both leads (Dhanraj & Prem) and
// admins can edit any BD member's targets on this page.

const WORKING_DAYS_PER_MONTH = 22;

const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
let CURRENT_EMAIL = "";
let TARGET_ROWS = []; // raw rows: { person_key, kpi_label, month, monthly_target }
let SELECTED_MONTH = "";

function currentMonthStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
}

function initials(name) { return name.split(" ").map(w => w[0]).join("").slice(0, 2).toUpperCase(); }
function cssId(name) { return name.replace(/[^a-z0-9]/gi, ""); }

// buildNav() comes from /config.js.

async function loadTargetOverrides() {
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/kpi_target_overrides?select=person_key,kpi_label,month,monthly_target`, {
      headers: { apikey: SUPABASE_ANON, Authorization: `Bearer ${SUPABASE_ANON}` }
    });
    if (!r.ok) return;
    TARGET_ROWS = await r.json();
  } catch { TARGET_ROWS = []; }
}

// Month-specific value if saved for that exact month, else the old
// no-month "default" row (pre-existing before per-month targets shipped),
// else null (caller falls back to the computed daily-rate default).
function resolveOverride(personKey, kpiLabel, month) {
  const exact = TARGET_ROWS.find(r => r.person_key === personKey && r.kpi_label === kpiLabel && r.month === month);
  if (exact) return exact.monthly_target;
  const fallback = TARGET_ROWS.find(r => r.person_key === personKey && r.kpi_label === kpiLabel && !r.month);
  return fallback ? fallback.monthly_target : null;
}

let RENDERED_MEMBERS = []; // [{ member, kpiKeys }] — reset each render(), used by Save All

async function saveAll() {
  const btn = document.getElementById("btn-save-all");
  const statusEl = document.getElementById("status-save-all");
  btn.disabled = true; btn.textContent = "Saving...";
  statusEl.classList.remove("show", "error");
  const updates = [];
  RENDERED_MEMBERS.forEach(({ member, kpiKeys }) => {
    const id = cssId(member);
    const key = pkey(member);
    kpiKeys.forEach(k => {
      const el = document.getElementById(`in-${id}-${cssId(k)}`);
      if (!el) return;
      updates.push({
        person_key: key, kpi_label: k, month: SELECTED_MONTH,
        monthly_target: Number(el.value) || 0,
        updated_by: CURRENT_EMAIL, updated_at: new Date().toISOString()
      });
    });
  });
  try {
    const { data: { session } } = await _supabase.auth.getSession();
    const token = session?.access_token || SUPABASE_ANON;
    const r = await fetch(`${SUPABASE_URL}/rest/v1/kpi_target_overrides?on_conflict=person_key,kpi_label,month`, {
      method: "POST",
      headers: { apikey: SUPABASE_ANON, Authorization: `Bearer ${token}`, "Content-Type": "application/json", Prefer: "resolution=merge-duplicates,return=minimal" },
      body: JSON.stringify(updates)
    });
    if (!r.ok) throw new Error("Save failed: " + r.status);
    updates.forEach(u => {
      const existing = TARGET_ROWS.find(r => r.person_key === u.person_key && r.kpi_label === u.kpi_label && r.month === u.month);
      if (existing) existing.monthly_target = u.monthly_target;
      else TARGET_ROWS.push(u);
    });
    statusEl.textContent = `Saved ${updates.length} targets for ${SELECTED_MONTH}!`;
    statusEl.classList.add("show");
    setTimeout(() => statusEl.classList.remove("show"), 4000);
  } catch(e) {
    statusEl.textContent = "Error: " + e.message; statusEl.classList.add("show", "error");
  } finally {
    btn.disabled = false; btn.textContent = "Save All";
  }
}

async function saveMember(member, kpiKeys) {
  const id = cssId(member);
  const btn = document.getElementById(`btn-${id}`);
  const statusEl = document.getElementById(`status-${id}`);
  btn.disabled = true; btn.textContent = "Saving...";
  statusEl.classList.remove("show", "error");
  const key = pkey(member);
  const updates = kpiKeys.map(k => ({
    person_key: key, kpi_label: k, month: SELECTED_MONTH,
    monthly_target: Number(document.getElementById(`in-${id}-${cssId(k)}`).value) || 0,
    updated_by: CURRENT_EMAIL, updated_at: new Date().toISOString()
  }));
  try {
    const { data: { session } } = await _supabase.auth.getSession();
    const token = session?.access_token || SUPABASE_ANON;
    const r = await fetch(`${SUPABASE_URL}/rest/v1/kpi_target_overrides?on_conflict=person_key,kpi_label,month`, {
      method: "POST",
      headers: { apikey: SUPABASE_ANON, Authorization: `Bearer ${token}`, "Content-Type": "application/json", Prefer: "resolution=merge-duplicates,return=minimal" },
      body: JSON.stringify(updates)
    });
    if (!r.ok) throw new Error("Save failed: " + r.status);
    updates.forEach(u => {
      const existing = TARGET_ROWS.find(r => r.person_key === u.person_key && r.kpi_label === u.kpi_label && r.month === u.month);
      if (existing) existing.monthly_target = u.monthly_target;
      else TARGET_ROWS.push(u);
    });
    statusEl.textContent = "Saved!"; statusEl.classList.add("show");
    setTimeout(() => statusEl.classList.remove("show"), 3000);
  } catch(e) {
    statusEl.textContent = "Error: " + e.message; statusEl.classList.add("show", "error");
  } finally {
    btn.disabled = false; btn.textContent = "Save Target";
  }
}

function memberCard(member, role, kpis) {
  const key = pkey(member);
  const id = cssId(member);
  const kpiKeys = kpis.map(k => k.key);
  RENDERED_MEMBERS.push({ member, kpiKeys });
  return `<div class="member-card">
    <div class="member-top">
      <div class="avatar">${initials(member)}</div>
      <div>
        <div class="member-name">${member}</div>
        <span class="role-badge">${role}</span>
      </div>
    </div>
    <div class="kpi-grid">
      ${kpis.map(k => {
        const resolved = resolveOverride(key, k.key, SELECTED_MONTH);
        const monthly = resolved != null ? resolved : Math.round(k.dailyTarget * WORKING_DAYS_PER_MONTH);
        return `<div class="kpi-field">
          <label>${k.key}</label>
          <input type="number" min="0" id="in-${id}-${cssId(k.key)}" value="${monthly}">
        </div>`;
      }).join("")}
    </div>
    <div class="member-actions">
      <button class="btn-save" id="btn-${id}" onclick='saveMember(${JSON.stringify(member)}, ${JSON.stringify(kpiKeys)})'>Save Target</button>
      <span class="save-status" id="status-${id}">Saved!</span>
    </div>
  </div>`;
}

function render(email) {
  RENDERED_MEMBERS = [];
  const isAdmin = ADMIN_EMAILS.includes(email);
  const isBDTL = BD_TL_EMAILS.includes(email);
  const container = document.getElementById("teams-container");
  if (!isAdmin && !isBDTL) {
    container.innerHTML = `<div class="empty">Your account isn't set up as a BD Team Lead. Contact an admin if this is unexpected.</div>`;
    return;
  }
  container.innerHTML = TEAMS.map(team => `<div class="team-section">
    <div class="team-title">${team.name}</div>
    ${team.members.map(m => memberCard(m, team.role, team.kpis)).join("")}
  </div>`).join("");
}

function showApp(user) {
  CURRENT_EMAIL = user.email || "";
  document.getElementById("auth-overlay").style.display = "none";
  document.getElementById("user-bar").style.display = "flex";
  document.getElementById("main-content").style.display = "block";
  document.getElementById("user-name").textContent = user.user_metadata?.full_name || user.email;
  const av = document.getElementById("user-avatar");
  if (user.user_metadata?.avatar_url) { av.src = user.user_metadata.avatar_url; av.style.display = ""; }
  buildNav(CURRENT_EMAIL);
  SELECTED_MONTH = currentMonthStr();
  document.getElementById("inp-month").value = SELECTED_MONTH;
  loadTargetOverrides().then(() => render(CURRENT_EMAIL));
}

document.getElementById("inp-month").onchange = (e) => {
  SELECTED_MONTH = e.target.value || currentMonthStr();
  render(CURRENT_EMAIL);
};

_supabase.auth.getSession().then(async ({ data: { session } }) => {
  await APP_USERS_READY;
  if (session?.user) {
    const email = session.user.email || "";
    if (ALLOWED_EMAILS.includes(email) && isPageAllowed(email, window.location.pathname)) showApp(session.user);
    else { _supabase.auth.signOut(); showAuthOverlay(); document.getElementById("auth-error").textContent = "Access denied. Your account is not authorized."; }
  } else showAuthOverlay();   // signed out, or a token too stale to refresh
});
_supabase.auth.onAuthStateChange(async (_e, session) => {
  await APP_USERS_READY;
  if (session?.user) {
    const email = session.user.email || "";
    if (ALLOWED_EMAILS.includes(email) && isPageAllowed(email, window.location.pathname)) showApp(session.user);
    else { _supabase.auth.signOut(); showAuthOverlay(); document.getElementById("auth-error").textContent = "Access denied. Your account is not authorized."; }
  } else showAuthOverlay();   // signed out, or a token too stale to refresh
});
document.getElementById("btn-google-signin").onclick = async () => {
  document.getElementById("auth-error").textContent = "";
  const { error } = await _supabase.auth.signInWithOAuth({
    provider: "google",
    options: { redirectTo: "https://elevate-dashboard-iota.vercel.app/manage-targets-bd.html" }
  });
  if (error) document.getElementById("auth-error").textContent = error.message;
};
document.getElementById("btn-signout").onclick = async () => { await _supabase.auth.signOut(); location.reload(); };
document.getElementById("btn-save-all").onclick = saveAll;
</script>
</body>
</html>
