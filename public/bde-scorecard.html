<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ElevateMe — BDE Scorecard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #080b14; --surface: #0f1322; --border: #1e2640;
    --text: #e8eaf6; --muted: #6b7499;
    --gold:#ffd740; --green:#00e676; --yellow:#ffab00; --orange:#ff6d00; --red:#ff4d6a;
  }
  body { background: var(--bg); color: var(--text); font-family:'Nunito Sans',sans-serif; min-height:100vh;
    background-image: radial-gradient(ellipse at 20% 10%, rgba(196,72,56,0.06) 0%, transparent 50%),
                      radial-gradient(ellipse at 80% 80%, rgba(0,230,118,0.04) 0%, transparent 50%); }
  header { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:1rem;
    background:#000; border-bottom:1px solid var(--border); padding:14px 24px; position:sticky; top:0; z-index:100; }
  .logo { display:flex; align-items:center; gap:12px; }
  .logo-img { height:36px; width:auto; display:block; }
  .logo-sub { font-size:15px; font-weight:400; color:#888; letter-spacing:0.2px; }
  .nav-links { display:flex; gap:8px; flex-wrap:wrap; }
  .nav-btn { padding:6px 14px; border-radius:20px; font-size:12px; font-weight:700; color:var(--muted);
    text-decoration:none; border:1px solid var(--border); background:none; transition:all .2s; }
  .nav-btn:hover { border-color:#ff4d3a; color:#ff4d3a; }
  .nav-btn.active { background:#ff4d3a; color:#fff; border-color:#ff4d3a; }
  .container { width:100%; padding:1.5rem; max-width:1500px; margin:0 auto; }
  .controls { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:1rem; align-items:end; }
  .field label { display:block; font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:6px; }
  .field input { width:100%; background:var(--surface); border:1px solid var(--border); color:var(--text); padding:10px; border-radius:8px; font-family:inherit; font-size:14px; }
  .presets { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:1.2rem; }
  .preset-btn { padding:7px 14px; border-radius:20px; font-size:12px; font-weight:700; background:var(--surface); border:1px solid var(--border); color:var(--muted); cursor:pointer; }
  .preset-btn.active { color:#fff; background:#ff4d3a; border-color:#ff4d3a; }
  .btn-gen { padding:10px 20px; border-radius:8px; font-weight:800; font-size:14px; background:#ff4d3a; color:#fff; border:none; cursor:pointer; }
  .btn-gen:disabled { opacity:.5; cursor:default; }
  .status { font-size:13px; color:var(--muted); margin-bottom:1rem; min-height:18px; }

  .team-block { margin-bottom:2rem; }
  .team-head { display:flex; align-items:baseline; gap:12px; margin-bottom:12px; padding-bottom:8px; border-bottom:1px solid var(--border); }
  .team-name { font-size:20px; font-weight:800; }
  .team-avg { font-size:14px; color:var(--muted); }
  .team-avg b { font-size:18px; }
  .team-kpi-note { font-size:12px; color:var(--muted); margin-left:auto; }

  .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:14px; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:18px; position:relative; }
  .card-top { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px; }
  .card-id { display:flex; align-items:center; gap:12px; }
  .avatar { width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:16px; border:2px solid; background:#1a1f30; }
  .card-name { font-size:16px; font-weight:800; }
  .card-role { font-size:12px; color:var(--muted); }
  .card-score { font-size:30px; font-weight:800; line-height:1; }
  .card-badge { display:inline-block; font-size:11px; font-weight:800; padding:3px 10px; border-radius:12px; border:1px solid; margin-top:6px; }
  .kpi-row { display:grid; grid-template-columns:1fr auto auto; gap:8px; align-items:center; padding:7px 0; border-top:1px solid var(--border); font-size:13px; }
  .kpi-row:first-of-type { border-top:none; }
  .kpi-name { color:var(--text); font-weight:600; }
  .kpi-name small { color:var(--muted); font-weight:400; }
  .kpi-av { font-weight:800; }
  .kpi-pct { font-weight:800; min-width:52px; text-align:right; }
  .bar { height:5px; border-radius:3px; background:#1a1f30; overflow:hidden; margin-top:3px; grid-column:1 / -1; }
  .bar > div { height:100%; border-radius:3px; }
  .funnel-sec { margin-top:14px; border-top:1px solid var(--border); padding-top:10px; }
  .funnel-sec h5 { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin-bottom:6px; }
  .fn-toggle { cursor:pointer; user-select:none; }
  .fn-toggle:hover { color:var(--text); }
  .fn-arrow { display:inline-block; width:10px; }
  /* The inline target editor these styled is gone — see the note by
     canEditTargets. Targets are edited on /manage-targets.html. */
  .edit-row { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px; }
  .edit-row label { font-size:12px; color:var(--text); }
  .edit-row input { width:80px; background:#111; border:1px solid var(--border); color:var(--text); border-radius:6px; padding:4px 6px; font-size:12px; }
  .btn-save-target { margin-top:4px; background:#ff4d3a; border:none; color:#fff; border-radius:6px; padding:6px 12px; font-size:12px; font-weight:600; cursor:pointer; }
  .fn-row { display:grid; grid-template-columns:1fr auto auto auto auto; gap:7px; font-size:12px; padding:3px 0; align-items:center; }
  .fn-row.fn-head { color:var(--muted); font-size:9.5px; text-transform:uppercase; letter-spacing:.3px; border-bottom:1px solid var(--border); padding-bottom:4px; }
  .fn-lbl { color:var(--text); }
  .fn-cur { font-weight:800; text-align:right; min-width:34px; }
  .fn-old { color:var(--muted); text-align:right; min-width:30px; }
  .fn-tot { font-weight:800; text-align:right; min-width:34px; }
  .fn-conv { color:var(--yellow); font-weight:700; text-align:right; min-width:38px; }
  .empty { text-align:center; color:var(--muted); padding:3rem; }
</style>
</head>
<body>
<header>
  <div class="logo">
    <img src="/e92c4bab-2eb7-4e8f-bc76-e00992442f1f.png" alt="ElevateMe" class="logo-img">
    <span class="logo-sub">BDE Scorecard</span>
  </div>
  <div class="nav-links" id="nav-links"></div>
</header>

<div class="container">
  <div class="controls">
    <div class="field"><label>Start date</label><input type="date" id="inp-start"></div>
    <div class="field"><label>End date</label><input type="date" id="inp-end"></div>
    <div class="field"><label>&nbsp;</label><button class="btn-gen" id="btn-gen">Generate</button></div>
    <div class="field"><label>View</label>
      <select id="inp-view" style="background:#0f1322;border:1px solid var(--border);color:inherit;padding:9px 11px;border-radius:8px;font-family:inherit;font-size:14px">
        <option value="team">By KPI team</option>
        <option value="tl">By team lead</option>
      </select>
    </div>
  </div>
  <div class="presets" id="presets">
    <div class="preset-btn active" data-preset="today">Today</div>
    <div class="preset-btn" data-preset="week">This Week</div>
    <div class="preset-btn" data-preset="month">This Month</div>
    <div class="preset-btn" data-preset="lastmonth">Last Month</div>
  </div>
  <div class="status" id="status"></div>
  <div id="results"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/config.js"></script>
<script>
// ── Auth: require the same Google login as the dashboard (live only) ──────────
// SUPABASE_URL/SUPABASE_ANON come from /config.js; this page's code was ported
// from the AUTH_URL/AUTH_ANON naming used on test, kept as a local alias.
const AUTH_URL = SUPABASE_URL, AUTH_ANON = SUPABASE_ANON;
const _auth = supabase.createClient(AUTH_URL, AUTH_ANON);
// ALLOWED_EMAILS, ADMIN_EMAILS, SALES_TL_EMAILS, BD_TL_EMAILS, buildNav() all
// come from /config.js.

// ── Team scorecard config ────────────────────────────────────────────────────
// Each team: members (exact CRM names) + KPIs. Each KPI: how to read the actual
// value from a BDE record, its daily target, and its weight (weights sum to 1).
const TEAMS = [
  {
    name: "LinkedIn Team",
    role: "LinkedIn BDE",
    members: bdMembersOf("LinkedIn Team"),
    kpis: [
      { label: "ICP Moderate", note: "Leads Generated", get: b => (b.types||{})["ICP Moderate"]||0, dailyTarget: 4,  weight: 0.70 },
      { label: "ICP Cold",     note: "Leads Generated", get: b => (b.types||{})["ICP Cold"]||0,     dailyTarget: 15, weight: 0.30 },
    ],
  },
  {
    name: "Portal Team",
    role: "Portal BDE",
    members: bdMembersOf("Portal Team"),
    // Scored on funnel conversion, not lead volume: each stage against the one
    // before it, which is the CONV% shown in the strip under the card. Weights
    // climb toward the outcome end deliberately — an enrolment is worth more
    // than a lead being worked. Generated is excluded; it is the denominator
    // of the first stage, not a stage that can be converted into.
    // Two rows on the card, both read-only: how many leads came in, by type.
    kpis: [
      { label: "ICP Cold",     note: "Leads Generated", get: b => (b.types||{})["ICP Cold"]||0,     display: true },
      { label: "ICP Moderate", note: "Leads Generated", get: b => (b.types||{})["ICP Moderate"]||0, display: true },
    ],
    // The score comes from the funnel strip below the card — its CONV% column,
    // weighted. Generated is the first denominator, not a scored stage.
    // Keyed by the stage label, which is also what /manage-targets.html stores a
    // per-person override against, so a team lead can retune these without a
    // code change.
    funnelWeights: {
      "Touched": 0.10, "Connected": 0.10, "Qualified": 0.10, "Discovery": 0.10,
      "Pres. Booked": 0.15, "Pres. Held": 0.20, "Enrolled": 0.25,
    },
  },
  {
    name: "Referral Team",
    role: "Referral BDE",
    members: bdMembersOf("Referral Team"),
    // This team is scored on Reference separately, so its ICP rows read
    // `typesExRef` — the same tallies with referral-sourced leads removed.
    // Using `types` here counted one referral lead twice: once as ICP Moderate
    // and again under Reference.
    kpis: [
      { label: "ICP Moderate", note: "Leads Generated (excl. Reference)", get: b => (b.typesExRef||{})["ICP Moderate"]||0, dailyTarget: 2,  weight: 0.30 },
      { label: "ICP Cold",     note: "Leads Generated (excl. Reference)", get: b => (b.typesExRef||{})["ICP Cold"]||0,     dailyTarget: 10, weight: 0.20 },
      { label: "Reference",    note: "Lead Source = Reference",           get: b => (b.sourceGroups||{}).Reference||0,    dailyTarget: 1,  weight: 0.50 },
    ],
  },
];

// Reporting lead per BDE, from config.js. Drives the "By team lead" view.
const TEAM_LEADS = BD_TEAM_LEADS;

const ZONE = s => s>=110?"gold":s>=95?"green":s>=75?"yellow":s>=50?"orange":"red";
const ZCOL = { gold:"var(--gold)", green:"var(--green)", yellow:"var(--yellow)", orange:"var(--orange)", red:"var(--red)" };
const ZLBL = { gold:"Golden Card", green:"Green Card", yellow:"Yellow Card", orange:"Orange Card", red:"Red Card" };

const fmt = d => d.toISOString().split("T")[0];
const todayEST = () => new Date().toLocaleDateString("en-CA",{timeZone:"America/New_York"});

function setPreset(kind){
  const today = new Date(todayEST()+"T12:00:00Z");
  let start = new Date(today), end = new Date(today);
  if (kind==="week"){ const dow=(today.getUTCDay()+6)%7; start.setUTCDate(today.getUTCDate()-dow); }
  else if (kind==="month"){ start = new Date(Date.UTC(today.getUTCFullYear(),today.getUTCMonth(),1)); }
  else if (kind==="lastmonth"){ start=new Date(Date.UTC(today.getUTCFullYear(),today.getUTCMonth()-1,1)); end=new Date(Date.UTC(today.getUTCFullYear(),today.getUTCMonth(),0)); }
  document.getElementById("inp-start").value = fmt(start);
  document.getElementById("inp-end").value   = fmt(end);
}
document.querySelectorAll(".preset-btn").forEach(btn => btn.onclick = () => {
  document.querySelectorAll(".preset-btn").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active"); setPreset(btn.dataset.preset); load();
});

function workingDays(start,end){
  let n=0; const d=new Date(start+"T12:00:00Z"), e=new Date(end+"T12:00:00Z");
  while(d<=e){ const w=d.getUTCDay(); if(w!==0&&w!==6)n++; d.setUTCDate(d.getUTCDate()+1); }
  return Math.max(1,n);
}

// ── Editable monthly targets (team-lead override, persisted in Supabase) ──────
// Two different real people are both named "Meet Patel" (a Closer under Mamta
// Das, and the BD Referral member here) — key the BD one distinctly so their
// stored overrides never collide.
const PERSON_KEY_OVERRIDES = { "Meet Patel": "Meet Patel (BD)" };
const pkey = m => PERSON_KEY_OVERRIDES[m] || m;

// Which BD members each team lead may edit targets for; admins may edit all.
// Derived from the roster, so a joiner or leaver needs no edit here.
let CURRENT_EMAIL = "";
// canEditTargets() was removed: the inline target editor it guarded is gone,
// superseded by /manage-targets.html, which does its own permission check.

let TARGET_ROWS = []; // raw rows: { person_key, kpi_label, month, monthly_target }
let _lastBdes = null, _lastRange = { start: "", end: "" };  // for view switching
let CURRENT_REPORT_MONTH = ""; // YYYY-MM of the report's start date, set by render()
async function loadTargetOverrides(month){
  TARGET_ROWS = await fetchTargetOverrides(month);
}
// Month-specific value if saved for that exact month, else the old
// no-month "default" row (pre-existing before per-month targets shipped),
// else null (caller falls back to the computed daily-rate default).
function resolveOverride(personKey, kpiLabel, month) {
  const exact = TARGET_ROWS.find(r => r.person_key === personKey && r.kpi_label === kpiLabel && r.month === month);
  if (exact) return exact.monthly_target;
  const fallback = TARGET_ROWS.find(r => r.person_key === personKey && r.kpi_label === kpiLabel && !r.month);
  return fallback ? fallback.monthly_target : null;
}
// Targets are edited on /manage-targets-bd.html — this page only reads and applies them.

const WORKING_DAYS_PER_MONTH = 22; // basis for converting a stored "monthly target" into a daily rate
// Days marked "leave" per person over the report range. Same table and
// shape the Sales dashboard reads, written by /attendance-bd.html.
let LEAVE_MAP = {};
async function loadLeaveMap(start, end){
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/attendance?date=gte.${start}&date=lte.${end}&status=eq.leave&select=person_name,date`, {
      headers: { apikey: SUPABASE_ANON, Authorization: `Bearer ${SUPABASE_ANON}` }
    });
    if (!r.ok) { LEAVE_MAP = {}; return; }
    const rows = await r.json();
    const map = {};
    rows.forEach(row => { map[row.person_name] = (map[row.person_name] || 0) + 1; });
    LEAVE_MAP = map;
  } catch { LEAVE_MAP = {}; }
}

// Which KPI team a BDE is measured against, regardless of who they report to.
function kpiTeamOf(member){
  return TEAMS.find(t => t.members.includes(member)) || null;
}

// Stage-to-stage conversion through the funnel, exactly as the strip under each
// card computes and displays it: this stage's TOTAL over the previous stage's.
// Both the strip and the score read this, so the percentage shown is the
// percentage scored.
//
// Returns null where the previous stage is empty — the conversion is undefined
// then, not zero, and a stage that could not be measured should not read as one
// that was failed.
function funnelConv(b) {
  const cur = b.cur || {}, old = b.old || {};
  const out = {};
  let prev = null;
  for (const [, stage] of FUNNEL_STAGES) {
    const total = (cur[stage] || 0) + (old[stage] || 0);
    out[stage] = prev === null ? null : (prev > 0 ? total / prev * 100 : null);
    prev = total;
  }
  return out;
}

// Capped at 150, the ceiling every other KPI uses, so one runaway stage cannot
// carry a card on its own.
const CONV_CAP = 150;

// `funnelWeights` on a team means: score this person from the funnel strip's
// conversion percentages, weighted. Their KPI rows are then read-only context.
// Built on first use, not at load: FUNNEL_STAGES is declared further down the
// file, and reading it here at module level threw a temporal-dead-zone error
// that broke the whole page.
let _stageOfLabel = null;
function stageOfLabel(label) {
  if (!_stageOfLabel) _stageOfLabel = Object.fromEntries(FUNNEL_STAGES.map(([lbl, k]) => [lbl, k]));
  return _stageOfLabel[label];
}

function scoreFromFunnel(b, weights, personKey) {
  const conv = funnelConv(b);
  let score = 0;
  const byLabel = {};
  for (const [label, builtIn] of Object.entries(weights)) {
    // Same "w:" override the KPI weights use, so the manage page reaches these too.
    const override = personKey ? resolveOverride(personKey, "w:" + label, CURRENT_REPORT_MONTH) : null;
    const weight = override != null ? override / 100 : builtIn;
    const raw = conv[stageOfLabel(label)];
    const pct = raw === null || raw === undefined ? null : Math.min(CONV_CAP, raw);
    score += (pct || 0) * weight;
    byLabel[label] = { weight, pct: pct === null ? null : Math.round(pct) };
  }
  return { score: Math.round(score), byLabel };
}

function scoreMember(member, kpis, bmap, wDays, funnelWeights){
  const b = bmap[member.toLowerCase()] || {};
  const key = pkey(member);
  let score = 0;
  const rows = kpis.map(k => {
    const actual = k.get(b);
    // A display row is shown for context and nothing else: no target, no
    // percentage, and no contribution to the score. The card colour comes
    // from funnel conversion alone.
    if (k.display) return { label: k.label, note: k.note, actual, target: null, pct: null, weight: 0, display: true };
    let target, pct;
    if (k.targetOf) {
      // Conversion KPI: the denominator is the previous funnel stage, so it
      // comes from this person's own data rather than a configured rate.
      target = k.targetOf(b);
      // Capped at 150, the same ceiling every other KPI uses — so the figure
      // on this row is the same CONV% the funnel strip below the card shows.
      // Capping at 100 instead made the card contradict itself: the row read
      // 100% while the funnel read 129% for the same stage.
      //
      // Above 100% means leads entered this stage from outside the previous one
      // rather than converting through it, so the stage can pay out more than
      // its weight. That is a known property of a cohort funnel, not a bug.
      //
      // An empty previous stage leaves the conversion undefined rather than
      // zero — null, so the row shows a dash instead of claiming 0% was
      // achieved. Either way the stage earns nothing.
      pct = target > 0 ? Math.min(150, actual / target * 100) : null;
    } else {
      const resolved = resolveOverride(key, k.label, CURRENT_REPORT_MONTH);
      const dailyRate = resolved != null ? resolved / WORKING_DAYS_PER_MONTH : k.dailyTarget;
      target = Math.max(1, Math.round(dailyRate * wDays));
      pct = target > 0 ? Math.min(150, actual / target * 100) : 0;
    }
    // Weightage is stored as a whole percentage under a "w:" prefixed label
    // by /manage-targets.html. Previously this always used the built-in
    // k.weight, so anything set there was silently ignored.
    const wOverride = resolveOverride(key, "w:" + k.label, CURRENT_REPORT_MONTH);
    const weight = wOverride != null ? wOverride / 100 : k.weight;
    score += (pct || 0) * weight;   // an undefined conversion earns nothing
    // Math.round(null) is 0, which would turn an undefined conversion back into
    // a claimed 0%. Kept as null so the row can render a dash.
    return { label:k.label, note:k.note, actual, target, pct: pct === null ? null : Math.round(pct), weight };
  });
  // Scored from the funnel instead, when the team is configured that way. The
  // rows above are still built and returned, but they carry no weight.
  if (funnelWeights) {
    const f = scoreFromFunnel(b, funnelWeights, key);
    return { score: f.score, rows, funnelWeighting: f.byLabel };
  }
  return { score: Math.round(score), rows };
}

const FUNNEL_STAGES = [
  ["Generated","generated"], ["Touched","touched"], ["Connected","connected"],
  ["Qualified","qualified"], ["Discovery","discovery"],
  ["Pres. Booked","presBooked"], ["Pres. Held","presHeld"], ["Enrolled","enrolled"],
];
// `weighting` is what scoreMember worked out for this person, so the strip can
// show which stages carry weight and read back the same percentages the score
// was built from — one conversion, displayed and scored.
function funnelSection(b, uid, weighting){
  const cur = b.cur || {}, old = b.old || {};
  const convOf = funnelConv(b);
  const rows = FUNNEL_STAGES.map(([lbl,k]) => {
    const c = cur[k]||0, o = old[k]||0, total = c + o;
    const w = weighting && weighting[lbl];
    const raw = convOf[k];
    const conv = raw === null || raw === undefined ? "—" : Math.round(raw) + "%";
    return `<div class="fn-row">
      <div class="fn-lbl">${lbl}${w ? ` <span style="color:var(--muted);font-weight:400">· ${Math.round(w.weight*100)}%</span>` : ""}</div>
      <div class="fn-cur" style="color:var(--green)">${c}</div>
      <div class="fn-old">${o}</div>
      <div class="fn-tot">${total}</div>
      <div class="fn-conv">${conv}</div>
    </div>`;
  }).join("");
  return `<div class="funnel-sec">
    <h5 class="fn-toggle" onclick="const el=document.getElementById('${uid}');const open=el.style.display!=='none';el.style.display=open?'none':'block';this.querySelector('.fn-arrow').textContent=open?'▸':'▾';">
      <span class="fn-arrow">▸</span> Funnel — Lead Generated cohort
    </h5>
    <div id="${uid}" style="display:none">
      <div class="fn-row fn-head"><div class="fn-lbl">Stage</div><div class="fn-cur">This Mo.</div><div class="fn-old">Old</div><div class="fn-tot">Total</div><div class="fn-conv">Conv%</div></div>
      ${rows}
    </div>
  </div>`;
}

function tile(member, role, kpis, bmap, wDays, funnelWeights){
  const { score, rows, funnelWeighting } = scoreMember(member, kpis, bmap, wDays, funnelWeights);
  const b = bmap[member.toLowerCase()] || {};
  const z = ZONE(score); const col = ZCOL[z];
  const initials = member.split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();
  return `<div class="card">
    <div class="card-top">
      <div class="card-id">
        <div class="avatar" style="color:${col};border-color:${col}">${initials}</div>
        <div><div class="card-name">${member}</div><div class="card-role">${role}${TEAM_LEADS[member] ? ` · TL: ${TEAM_LEADS[member]}` : ""}</div></div>
      </div>
      <div style="text-align:right">
        <div class="card-score" style="color:${col};text-shadow:0 0 12px ${col}">${score}%</div>
        <div class="card-badge" style="color:${col};border-color:${col}">${ZLBL[z]}</div>
      </div>
    </div>
    ${rows.map(r=>{
      // Display row: the count, and a note saying it is not scored. No
      // percentage or bar, because there is nothing it is measured against.
      if (r.display) return `<div class="kpi-row">
        <div class="kpi-name">${r.label} <small>· ${r.note} · not scored</small></div>
        <div class="kpi-av">${r.actual}</div>
        <div class="kpi-pct" style="color:var(--muted)">—</div>
        <div class="bar"></div>
      </div>`;
      // A scored stage with nothing in the stage before it: keep the weight on
      // show, but a dash rather than a percentage, since there was nothing to
      // convert from this period.
      if (r.pct === null) return `<div class="kpi-row">
        <div class="kpi-name">${r.label} <small>· ${r.note} · ${Math.round(r.weight*100)}%</small></div>
        <div class="kpi-av">${r.actual}<span style="color:var(--muted);font-weight:400">/${r.target}</span></div>
        <div class="kpi-pct" style="color:var(--muted)" title="No leads in the previous stage this period">—</div>
        <div class="bar"></div>
      </div>`;
      const rc = r.pct>=110?"var(--gold)":r.pct>=95?"var(--green)":r.pct>=75?"var(--yellow)":r.pct>=50?"var(--orange)":"var(--red)";
      return `<div class="kpi-row">
        <div class="kpi-name">${r.label} <small>· ${r.note} · ${Math.round(r.weight*100)}%</small></div>
        <div class="kpi-av">${r.actual}<span style="color:var(--muted);font-weight:400">/${r.target}</span></div>
        <div class="kpi-pct" style="color:${rc}">${r.pct}%</div>
        <div class="bar"><div style="width:${Math.min(100,r.pct)}%;background:${rc}"></div></div>
      </div>`;
    }).join("")}
    ${funnelSection(b, "fn-" + member.replace(/[^a-z0-9]/gi,""), funnelWeighting)}
  </div>`;
}

function render(bdes, start, end){
  CURRENT_REPORT_MONTH = start.slice(0, 7);
  const wDays = workingDays(start, end);
  const bmap = {};
  bdes.forEach(b => { bmap[(b.name||"").toLowerCase()] = b; });
  const view = (document.getElementById("inp-view") || {}).value || "team";
  if (view === "tl") return renderByTL(bmap, wDays);
  let html = "";
  TEAMS.forEach(team => {
    const scores = team.members.map(m => scoreMember(m, team.kpis, bmap, wDays, team.funnelWeights).score);
    const avg = scores.length ? Math.round(scores.reduce((a,b)=>a+b,0)/scores.length) : 0;
    const z = ZONE(avg); const col = ZCOL[z];
    const kpiNote = team.funnelWeights
      ? "Scored on funnel conversion · " + Object.entries(team.funnelWeights).map(([l,w])=>`${l} ${Math.round(w*100)}%`).join(" · ")
      : team.kpis.filter(k=>!k.display).map(k=>`${k.label} ${k.targetOf ? k.note : k.dailyTarget + "/day"} (${Math.round(k.weight*100)}%)`).join(" · ");
    html += `<div class="team-block">
      <div class="team-head">
        <div class="team-name" style="color:${col}">${team.name}</div>
        <div class="team-avg">Avg Score <b style="color:${col}">${avg}%</b></div>
        <div class="team-kpi-note">${kpiNote} · ${wDays} working days</div>
      </div>
      <div class="cards">${team.members.map(m => tile(m, team.role, team.kpis, bmap, wDays, team.funnelWeights)).join("")}</div>
    </div>`;
  });
  document.getElementById("results").innerHTML = html;
}

// Grouped by reporting lead, not by KPI team. A BDE is scored against their
// own KPI team's targets and weights, then counted in their lead's bucket.
function renderByTL(bmap, wDays){
  // Built from TEAM_LEADS so a roster change in one place is enough.
  const buckets = {};
  Object.entries(TEAM_LEADS).forEach(([member, lead]) => {
    (buckets[lead] = buckets[lead] || []).push(member);
  });
  // Anyone in a KPI team but missing from TEAM_LEADS would otherwise vanish
  // from this view entirely, so they are surfaced rather than dropped.
  const assigned = new Set(Object.keys(TEAM_LEADS));
  const orphans = TEAMS.flatMap(t => t.members).filter(m => !assigned.has(m));
  if (orphans.length) buckets["Unassigned"] = orphans;

  const leads = Object.keys(buckets).sort((a, b) =>
    a === "Unassigned" ? 1 : b === "Unassigned" ? -1 : a.localeCompare(b));

  let html = "";
  leads.forEach(lead => {
    const members = buckets[lead];
    // Everyone on the roster counts toward the lead, including anyone on
    // leave for the whole period — they contribute 0, because covering for
    // an absent member is the lead's responsibility. Matches how the Sales
    // team-lead health score is computed.
    const scored = members.map(m => {
      const team = kpiTeamOf(m);
      const onLeave = (LEAVE_MAP[m] || 0) >= wDays && wDays > 0;
      const s = team ? scoreMember(m, team.kpis, bmap, wDays).score : 0;
      return { name: m, team, onLeave, score: onLeave ? 0 : s };
    });
    const health = scored.length
      ? Math.round(scored.reduce((a, m) => a + m.score, 0) / scored.length)
      : 0;
    const z = ZONE(health); const col = ZCOL[z];
    const onLeaveCount = scored.filter(m => m.onLeave).length;
    const sorted = [
      ...scored.filter(m => !m.onLeave).sort((a, b) => b.score - a.score),
      ...scored.filter(m => m.onLeave),
    ];
    html += `<div class="team-block">
      <div class="team-head">
        <div class="team-name" style="color:${col}">${lead}</div>
        <div class="team-avg">Health <b style="color:${col}">${health}%</b></div>
        <div class="team-kpi-note">${scored.length} member${scored.length === 1 ? "" : "s"}${onLeaveCount ? ` · ${onLeaveCount} on leave (counted as 0)` : ""} · ${wDays} working days</div>
      </div>
      <div class="cards">${sorted.map(m => m.team
        ? tile(m.name, m.team.role, m.team.kpis, bmap, wDays)
        : `<div class="card"><div class="card-top"><div class="card-id"><div><div class="card-name">${m.name}</div><div class="card-role">No KPI team configured</div></div></div></div></div>`
      ).join("")}</div>
    </div>`;
  });
  document.getElementById("results").innerHTML = html;
}

async function load(){
  const start = document.getElementById("inp-start").value;
  const end   = document.getElementById("inp-end").value;
  if (!start || !end) return;
  const btn = document.getElementById("btn-gen");
  btn.disabled = true; btn.textContent = "Loading...";
  document.getElementById("status").textContent = "Fetching BDE data from Zoho…";
  try {
    await loadTargetOverrides(start.slice(0, 7));
    await loadLeaveMap(start, end);
    const { data: { session: bdeSession } } = await _auth.auth.getSession();
    const res = await fetch(`/api/bde?startDate=${start}&endDate=${end}`, {
      headers: { Authorization: `Bearer ${bdeSession?.access_token || ""}` }
    });
    const data = await readApiJson(res, "BDE data");
    const cache = res.headers.get("X-Cache")==="HIT";
    document.getElementById("status").textContent =
      `${start} → ${end} · ${workingDays(start,end)} working days · ${cache?"cache ⚡":"live from Zoho"}`;
    _lastBdes = data.bdes || [];
    _lastRange = { start, end };
    render(_lastBdes, start, end);
  } catch(e){
    document.getElementById("status").textContent = "Error: " + e.message;
    document.getElementById("results").innerHTML = `<div class="empty">${e.message}</div>`;
  } finally {
    btn.disabled = false; btn.textContent = "Generate";
  }
}
document.getElementById("btn-gen").onclick = load;
// Switching view is a pure re-render of data already fetched, so it must not
// go back to Zoho.
document.getElementById("inp-view").onchange = () => {
  if (_lastBdes) render(_lastBdes, _lastRange.start, _lastRange.end);
};

// Require Google login (same session as the dashboard); bounce to / otherwise.
document.body.style.visibility = "hidden";
_auth.auth.getSession().then(async ({ data: { session } }) => {
  await APP_USERS_READY;
  const email = session?.user?.email || "";
  if (session?.user && ALLOWED_EMAILS.includes(email) && isPageAllowed(email, window.location.pathname)) {
    CURRENT_EMAIL = email;
    document.body.style.visibility = "";
    buildNav(email);
    setPreset("today");
    load();
  } else {
    window.location.replace("/");
  }
});
</script>
