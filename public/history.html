<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ElevateMe — Performance History</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #080b14; --surface: #0f1322; --border: #1e2640;
    --text: #e8eaf6; --muted: #6b7499;
    --neon-gold: #ffd740; --neon-green: #00e676;
    --neon-yellow: #ffab00; --neon-orange: #ff6d00; --neon-red: #ff1744;
    --neon-leave: #8888cc;
  }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Nunito Sans', sans-serif; min-height: 100vh;
    background-image: radial-gradient(ellipse at 20% 10%, rgba(196,72,56,0.06) 0%, transparent 50%),
                      radial-gradient(ellipse at 80% 80%, rgba(0,230,118,0.04) 0%, transparent 50%);
  }
  header {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem;
    background: #000; border-bottom: 1px solid var(--border);
    padding: 14px 24px; position: sticky; top: 0; z-index: 100;
  }
  .logo { display: flex; align-items: center; gap: 12px; }
  .logo-img { height: 36px; width: auto; display: block; }
  .logo-sub { font-size: 15px; font-weight: 400; color: #888; letter-spacing: 0.2px; }
  .nav-links { display: flex; gap: 8px; flex-wrap: wrap; }
  .nav-btn { padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; color: var(--muted);
    text-decoration: none; border: 1px solid var(--border); background: none; transition: all .2s; }
  .nav-btn:hover { border-color: #ff4d3a; color: #ff4d3a; }
  .nav-btn.active { background: #ff4d3a; color: #fff; border-color: #ff4d3a; }
  .container { width: 100%; padding: 1.5rem; max-width: 1600px; margin: 0 auto; }

  .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 1rem; align-items: end; }
  .field label { display: block; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
  .field input, .field select {
    width: 100%; background: var(--surface); border: 1px solid var(--border);
    color: var(--text); padding: 10px; border-radius: 8px; font-family: inherit; font-size: 14px;
  }
  .presets { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1.2rem; }
  .preset-btn { padding: 7px 14px; border-radius: 20px; font-size: 12px; font-weight: 700;
    background: var(--surface); border: 1px solid var(--border); color: var(--muted); cursor: pointer; }
  .preset-btn.active { color: #fff; background: #ff4d3a; border-color: #ff4d3a; }
  .btn-gen { padding: 10px 20px; border-radius: 8px; font-weight: 800; font-size: 14px;
    background: #ff4d3a; color: #fff; border: none; cursor: pointer; }
  .btn-gen:disabled { opacity: 0.5; cursor: default; }

  .status { font-size: 13px; color: var(--muted); margin-bottom: 1rem; min-height: 18px; }

  /* The header carries the whole team summary; member cards sit collapsed
     underneath until someone actually wants the individual detail. */
  .team-block {
    margin-bottom: 14px; border-radius: 16px; position: relative; overflow: hidden;
    border: 1px solid var(--border);
    /* Plain fill first so a browser without color-mix() still gets a surface
       rather than dropping the whole declaration and rendering transparent. */
    background: rgba(17,21,38,0.85);
    background:
      radial-gradient(120% 140% at 0% 0%, color-mix(in srgb, var(--team-color) 9%, transparent) 0%, transparent 55%),
      linear-gradient(180deg, rgba(17,21,38,0.92), rgba(12,15,28,0.75));
    transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
  }
  .team-block::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: var(--team-color); box-shadow: 0 0 16px var(--team-color);
  }
  .team-block:hover { border-color: #2c3556; border-color: color-mix(in srgb, var(--team-color) 45%, var(--border)); transform: translateY(-1px); }
  .team-block.open { box-shadow: 0 14px 38px rgba(0,0,0,0.45); }

  .team-head {
    display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
    padding: 16px 20px 16px 25px; cursor: pointer; user-select: none;
  }
  .team-id { display: flex; align-items: center; gap: 13px; flex: none; min-width: 208px; }
  .team-avatar {
    width: 44px; height: 44px; border-radius: 50%; flex: none;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 800; letter-spacing: 0.5px;
    color: var(--team-color); border: 2px solid var(--team-color);
    background: rgba(255,255,255,0.05);
    background: color-mix(in srgb, var(--team-color) 12%, transparent);
    box-shadow: 0 0 18px -5px var(--team-color);
  }
  .team-name { font-size: 17px; font-weight: 800; line-height: 1.2; letter-spacing: -0.2px; }
  .team-role { font-size: 11px; color: var(--muted); margin-top: 3px; display: flex; align-items: center; gap: 6px; }
  .team-caret { font-size: 9px; color: var(--muted); transition: transform 0.2s; }
  .team-block.open .team-caret { transform: rotate(90deg); }

  .team-stats { display: flex; gap: 10px; flex-wrap: wrap; flex: 1; min-width: 0; }
  .tstat {
    flex: 1; min-width: 138px; padding: 11px 14px 12px; border-radius: 12px;
    background: rgba(255,255,255,0.028); border: 1px solid var(--border);
    position: relative; overflow: hidden;
  }
  .tstat::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px;
    background: var(--stat-color, transparent); opacity: 0.6;
  }
  .tstat-lbl {
    font-size: 9px; color: var(--muted); text-transform: uppercase;
    letter-spacing: 0.9px; font-weight: 700; margin-bottom: 5px;
  }
  .tstat-val { font-size: 23px; font-weight: 800; line-height: 1.05; letter-spacing: -0.6px; }
  .tstat-val small { font-size: 13px; font-weight: 700; opacity: 0.75; margin-left: 1px; }
  .tstat-sub { font-size: 10.5px; color: var(--muted); margin-top: 4px; }
  .tstat-bar { height: 3px; border-radius: 2px; background: rgba(255,255,255,0.07); margin-top: 7px; overflow: hidden; }
  .tstat-bar i { display: block; height: 100%; border-radius: 2px; background: var(--stat-color); }

  .team-meta { font-size: 11px; color: var(--muted); flex: none; text-align: right; line-height: 1.6; }
  .team-meta b { color: var(--text); font-size: 13px; }

  .team-body { display: none; padding: 4px 20px 20px 25px; border-top: 1px solid var(--border); }
  .team-block.open .team-body { display: block; }

  /* Organisation banner — same four tiles as a team, sat above them and styled
     a step heavier so it reads as the roll-up rather than a fourth team. It has
     no member list, so nothing here is clickable. */
  .org-block {
    margin-bottom: 20px; border-radius: 16px; position: relative; overflow: hidden;
    border: 1px solid var(--border);
    background: rgba(17,21,38,0.9);
    background:
      radial-gradient(130% 150% at 0% 0%, color-mix(in srgb, var(--team-color) 14%, transparent) 0%, transparent 60%),
      linear-gradient(180deg, rgba(20,25,45,0.95), rgba(12,15,28,0.8));
  }
  .org-block::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
    background: var(--team-color); box-shadow: 0 0 20px var(--team-color);
  }
  .org-head { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; padding: 18px 22px 18px 26px; }
  .org-id { display: flex; align-items: center; gap: 14px; flex: none; min-width: 208px; }
  .org-badge {
    width: 48px; height: 48px; border-radius: 14px; flex: none;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 800; letter-spacing: 1px;
    color: var(--team-color); border: 2px solid var(--team-color);
    background: rgba(255,255,255,0.05);
    background: color-mix(in srgb, var(--team-color) 14%, transparent);
    box-shadow: 0 0 20px -5px var(--team-color);
  }
  .org-name { font-size: 27px; font-weight: 800; letter-spacing: -0.03em; }
  .org-sub { font-size: 12.5px; color: var(--muted); margin-top: 5px; font-variant-numeric: tabular-nums; }

  /* ── Redesign ────────────────────────────────────────────────────────────
     Metric tiles are bordered cards with a coloured top edge, a large figure,
     a progress bar and a caption. The org banner pairs them with a health
     sparkline; a team row pairs them with a right-hand rail. Numerals are set
     tabular so columns of figures line up — the design used a monospace face
     for this, but Nunito Sans is the project font, so the alignment comes from
     the numeral variant instead of a second typeface. */
  .mstat {
    border: 1px solid var(--border); border-top: 2px solid var(--stat-color, var(--border));
    border-radius: 16px; background: rgba(10,13,24,0.55);
    padding: 16px; display: flex; flex-direction: column; gap: 13px;
    transition: transform 0.2s ease, border-color 0.2s ease; min-width: 0;
  }
  .mstat:hover { transform: translateY(-3px); }
  .mstat-lbl {
    font-size: 10.5px; letter-spacing: 0.13em; text-transform: uppercase;
    color: var(--muted); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .mstat-val {
    display: flex; align-items: baseline; gap: 3px;
    font-size: 34px; font-weight: 800; letter-spacing: -0.035em; line-height: 0.9;
    color: var(--stat-color); font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .mstat-val small { font-size: 16px; font-weight: 700; opacity: 0.7; }
  .mstat-foot { margin-top: auto; display: flex; flex-direction: column; gap: 9px; }
  .mstat-bar { height: 4px; border-radius: 999px; background: rgba(255,255,255,0.09); overflow: hidden; }
  .mstat-bar i { display: block; height: 100%; border-radius: 999px; background: var(--stat-color); transition: width 1s cubic-bezier(0.22,1,0.36,1); }
  .mstat-note { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mstat-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 14px; }
  @media (max-width: 1180px) { .mstat-grid { grid-template-columns: repeat(2, minmax(0,1fr)); } }
  @media (max-width: 640px)  { .mstat-grid { grid-template-columns: 1fr; } }

  .org-layout { display: grid; grid-template-columns: 300px 1fr; gap: 32px; align-items: start; }
  @media (max-width: 1180px) { .org-layout { grid-template-columns: 1fr; gap: 22px; } }
  .org-trend { border-top: 1px solid var(--border); padding-top: 18px; display: flex; flex-direction: column; gap: 8px; }
  .org-trend-lbl { font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .org-trend svg { width: 100%; height: 76px; display: block; overflow: visible; }
  .org-trend-axis { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* Team row: identity, metrics, then a rail of counts. */
  .team-grid { display: grid; grid-template-columns: 290px 1fr 128px; gap: 26px; align-items: center; }
  @media (max-width: 1180px) { .team-grid { grid-template-columns: 1fr; gap: 18px; } }
  .team-rail { display: flex; flex-direction: column; gap: 9px; align-items: flex-end; text-align: right; }
  .team-rail b { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; display: block; }
  .team-rail span { font-size: 11.5px; color: var(--muted); }
  .team-rail .rail-card {
    font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 800;
    border: 1px solid var(--team-color); color: var(--team-color);
    border-radius: 999px; padding: 4px 11px; margin-top: 2px; white-space: nowrap;
  }
  @media (max-width: 1180px) { .team-rail { flex-direction: row; align-items: center; gap: 18px; text-align: left; } }

  /* Derived figures shown when a team is expanded, above the member cards. */
  .team-detail {
    display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 20px;
    padding: 18px 0 20px; border-bottom: 1px solid var(--border); margin-bottom: 18px;
  }
  @media (max-width: 900px) { .team-detail { grid-template-columns: repeat(2, minmax(0,1fr)); } }
  .team-detail dt { font-size: 10px; letter-spacing: 0.13em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .team-detail dd { font-size: 17px; font-weight: 700; margin-top: 6px; font-variant-numeric: tabular-nums; }

  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; position: relative; overflow: hidden; }
  .card.leave { opacity: 0.65; }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
  .card-name { font-size: 16px; font-weight: 800; }
  .card-role { font-size: 12px; color: var(--muted); }
  .card-score { font-size: 26px; font-weight: 800; }
  .card-badge { display: inline-block; font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: 12px; margin-top: 4px; border: 1px solid; }
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px 4px; margin: 10px 0; }
  .kpi { text-align: center; }
  .kpi-val { font-size: 17px; font-weight: 800; }
  .kpi-lbl { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .attend { font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); padding-top: 8px; margin-top: 6px; }
  .attend .leave-tag { color: var(--neon-leave); font-weight: 800; }

  .raw-section { border: 1px solid var(--border); border-radius: 22px; background: rgba(15,19,34,0.55); overflow: hidden; margin-top: 16px; }
  .toggle-daily {
    width: 100%; display: flex; align-items: center; gap: 12px;
    background: transparent; border: none; padding: 20px 24px; cursor: pointer;
    color: var(--text); font-size: 15px; font-weight: 700; text-align: left;
    font-family: inherit; transition: background 0.16s ease; user-select: none;
  }
  .toggle-daily:hover { background: rgba(255,255,255,0.03); }
  .toggle-daily .caret { font-size: 10px; color: var(--neon-green); transition: transform 0.22s ease; display: inline-block; }
  .toggle-daily.open .caret { transform: rotate(90deg); }
  .toggle-daily .raw-count { margin-left: auto; font-size: 11.5px; color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
  .daily-wrap { overflow-x: auto; display: none; padding: 0 24px 22px; }
  .daily-wrap.show { display: block; }
  table.daily { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 900px; }
  table.daily th, table.daily td { padding: 7px 10px; text-align: center; border-bottom: 1px solid var(--border); white-space: nowrap; }
  table.daily th { color: var(--muted); text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; position: sticky; top: 0; background: var(--bg); }
  table.daily td.name { text-align: left; font-weight: 700; }
  .st-leave { color: var(--neon-leave); font-weight: 800; }
  .empty { text-align: center; color: var(--muted); padding: 3rem; font-size: 15px; }
</style>
</head>
<body>
<header>
  <div class="logo">
    <img src="/e92c4bab-2eb7-4e8f-bc76-e00992442f1f.png" alt="ElevateMe" class="logo-img">
    <span class="logo-sub">Performance History</span>
  </div>
  <div class="nav-links" id="nav-links"></div>
</header>

<div class="container">
  <div class="controls">
    <div class="field"><label>Start date</label><input type="date" id="inp-start"></div>
    <div class="field"><label>End date</label><input type="date" id="inp-end"></div>
    <div class="field"><label>Role</label>
      <select id="inp-role">
        <option value="all">All</option>
        <option value="Builder">Builders</option>
        <option value="Closer">Closers</option>
      </select>
    </div>
    <div class="field"><label>Team</label>
      <select id="inp-team">
        <option value="all">All Teams</option>
        <option value="Soham">Soham</option>
        <option value="Tejasvi">Tejasvi</option>
        <option value="Mamta Das">Mamta Das</option>
      </select>
    </div>
    <div class="field"><label>Person</label>
      <select id="inp-person"><option value="all">All People</option></select>
    </div>
    <div class="field"><label>&nbsp;</label><button class="btn-gen" id="btn-gen">Generate</button></div>
  </div>

  <div class="presets" id="presets">
    <div class="preset-btn active" data-preset="yesterday">Yesterday</div>
    <div class="preset-btn" data-preset="week">This Week</div>
    <div class="preset-btn" data-preset="month">This Month</div>
    <div class="preset-btn" data-preset="lastmonth">Last Month</div>
    <div class="preset-btn" data-preset="7">Last 7 Days</div>
  </div>

  <div class="status" id="status"></div>
  <div id="results"></div>

  <div class="raw-section" id="raw-section" style="display:none">
    <button type="button" class="toggle-daily" id="toggle-daily">
      <span class="caret">▶</span>
      <span id="raw-label">Show daily breakdown</span>
      <span class="raw-count" id="raw-count"></span>
    </button>
    <div class="daily-wrap" id="daily-wrap"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/config.js"></script>
<script>
// Data source: test Supabase snapshot project (daily_kpi lives here for now).
// Named distinctly from the live SUPABASE_URL/SUPABASE_ANON in /config.js,
// which this page also uses (below) for login.
const SNAPSHOT_SUPABASE_URL  = "https://czfsjrvngiojjjevmvtz.supabase.co";
const SNAPSHOT_SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN6ZnNqcnZuZ2lvampqZXZtdnR6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0ODc0NzIsImV4cCI6MjA5ODA2MzQ3Mn0.IbK1th8wcdrHOgJL1y5kQE3De1c0HSe0ju4Q9vNQ9BQ";

// Auth: LIVE Supabase project (same Google login/session as the main dashboard).
// SUPABASE_URL/SUPABASE_ANON, ALLOWED_EMAILS, ADMIN_EMAILS, SALES_TL_EMAILS,
// BD_TL_EMAILS, and buildNav() all come from /config.js.
const AUTH_URL = SUPABASE_URL, AUTH_ANON = SUPABASE_ANON;
const _auth = supabase.createClient(AUTH_URL, AUTH_ANON);

const TARGETS        = { calls:150, minutes:180, leads:4, discoveries:2, presBooked:2, presCompleted:2 };
const WEIGHTS        = { calls:0.20, minutes:0.20, leads:0.10, discoveries:0.15, presBooked:0.10, presCompleted:0.25 };
const TARGETS_CLOSER = { calls:60, minutes:120, presentations:2 };
const WEIGHTS_CLOSER = { calls:0.40, minutes:0.20, presentations:0.40 };

// Match the main dashboard's runtime zone colours exactly (note red = #ff4d6a)
const ZONE_COLOR = { gold:"#ffd740", green:"#00e676", yellow:"#ffab00", orange:"#ff6d00", red:"#ff4d6a" };
const CARD_LABEL = { gold:"Golden Card", green:"Green Card", yellow:"Yellow Card", orange:"Orange Card", red:"Red Card" };

const zone = s => s>=110?"gold":s>=95?"green":s>=75?"yellow":s>=50?"orange":"red";
const cap  = (v,t) => Math.min(150, t>0 ? (v/t)*100 : 0);

function scoreBuilder(b, t){
  return Math.round(
    cap(b.calls,t.calls)*WEIGHTS.calls + cap(b.minutes,t.minutes)*WEIGHTS.minutes +
    cap(b.leads,t.leads)*WEIGHTS.leads + cap(b.discoveries,t.discoveries)*WEIGHTS.discoveries +
    cap(b.presBooked,t.presBooked)*WEIGHTS.presBooked + cap(b.presCompleted,t.presCompleted)*WEIGHTS.presCompleted
  );
}
function scoreCloser(c, t){
  const k = cap(c.calls,t.calls)*WEIGHTS_CLOSER.calls + cap(c.minutes,t.minutes)*WEIGHTS_CLOSER.minutes +
            cap(c.presentations,t.presentations)*WEIGHTS_CLOSER.presentations;
  // Range report deal override: Gold >= 4 deals, Green >= 2 deals, else pure KPI
  if (c.dealsClosed >= 4) return Math.round(Math.min(Math.max(k*1.50,110),150));
  if (c.dealsClosed >= 2) return Math.round(Math.min(Math.max(k*1.25,95),125));
  return Math.round(Math.min(k,110));
}

const fmt = d => d.toISOString().split("T")[0];
function todayEST(){ return new Date().toLocaleDateString("en-CA", { timeZone:"America/New_York" }); }

function setPreset(kind){
  const today = new Date(todayEST() + "T12:00:00Z");
  let start = new Date(today), end = new Date(today);
  // This page reads saved snapshots, and today's is only written by the
  // overnight job — so "today" is always empty here. Yesterday is the most
  // recent day that actually has data, and it's what the page opens on.
  if (kind === "yesterday"){ start.setUTCDate(today.getUTCDate()-1); end.setUTCDate(today.getUTCDate()-1); }
  else if (kind === "week"){ const dow = (today.getUTCDay()+6)%7; start.setUTCDate(today.getUTCDate()-dow); }
  else if (kind === "month"){ start = new Date(Date.UTC(today.getUTCFullYear(), today.getUTCMonth(), 1)); }
  else if (kind === "lastmonth"){ start = new Date(Date.UTC(today.getUTCFullYear(), today.getUTCMonth()-1, 1)); end = new Date(Date.UTC(today.getUTCFullYear(), today.getUTCMonth(), 0)); }
  else if (kind === "7"){ start.setUTCDate(today.getUTCDate()-6); }
  document.getElementById("inp-start").value = fmt(start);
  document.getElementById("inp-end").value   = fmt(end);
}

document.querySelectorAll(".preset-btn").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll(".preset-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    setPreset(btn.dataset.preset);
    load();
  };
});

function weekdaysBetween(start, end){
  let n = 0; const d = new Date(start+"T12:00:00Z"), e = new Date(end+"T12:00:00Z");
  while (d <= e){ const w = d.getUTCDay(); if (w!==0 && w!==6) n++; d.setUTCDate(d.getUTCDate()+1); }
  return n;
}

async function fetchRows(start, end){
  const url = `${SNAPSHOT_SUPABASE_URL}/rest/v1/daily_kpi?date=gte.${start}&date=lte.${end}&select=*&order=date.asc,person_name.asc&limit=100000`;
  const r = await fetch(url, { headers:{ apikey:SNAPSHOT_SUPABASE_ANON, Authorization:`Bearer ${SNAPSHOT_SUPABASE_ANON}` } });
  if (!r.ok) throw new Error("Supabase " + r.status);
  return r.json();
}

// Leave marks come from the LIVE Supabase attendance table (where the team
// actually marks present/leave). Returns a Set of "person_name|date".
async function fetchLeaveSet(start, end){
  try {
    const url = `${AUTH_URL}/rest/v1/attendance?date=gte.${start}&date=lte.${end}&status=eq.leave&select=person_name,date`;
    const r = await fetch(url, { headers:{ apikey:AUTH_ANON, Authorization:`Bearer ${AUTH_ANON}` } });
    if (!r.ok) return new Set();
    const rows = await r.json();
    return new Set((rows || []).map(x => `${x.person_name}|${x.date}`));
  } catch { return new Set(); }
}

function aggregate(rows){
  const map = {};
  rows.forEach(row => {
    const id = row.person_id;
    if (!map[id]) map[id] = {
      id, name:row.person_name, role:row.role, tl:row.team_lead || "Unassigned",
      calls:0, inbound:0, outbound:0, missed:0, minutes:0,
      leads:0, discoveries:0, presBooked:0, presCompleted:0,
      presentations:0, dealsClosed:0, newUpfront:0, futureUpfront:0,
      days:0, leaveDays:0,
    };
    const m = map[id];
    // Rows arrive oldest-first, so keep overwriting: a person who changed role
    // or team mid-period is shown and scored as what they are now, not as
    // whatever they were on the first day of the range.
    m.name = row.person_name;
    m.role = row.role;
    if (row.team_lead) m.tl = row.team_lead;
    m.calls += row.calls; m.inbound += row.inbound; m.outbound += row.outbound; m.missed += row.missed;
    m.minutes += row.minutes; m.leads += row.leads; m.discoveries += row.discoveries;
    m.presBooked += row.pres_booked; m.presCompleted += row.pres_completed;
    m.presentations += row.presentations; m.dealsClosed += row.deals_closed;
    m.newUpfront += Number(row.new_upfront); m.futureUpfront += Number(row.future_upfront);
    m.days += 1; if (_leaveSet.has(`${row.person_name}|${row.date}`)) m.leaveDays += 1;
  });
  return Object.values(map);
}

function scoreFor(p){
  // Target = ALL working days in the period; leave is NOT deducted (leave is the
  // person's own choice, so they're still measured against the full month).
  const workDays = Math.max(0.1, p.days);
  if (p.role === "Closer"){
    const t = Object.fromEntries(Object.entries(TARGETS_CLOSER).map(([k,v]) => [k, v*workDays]));
    return scoreCloser(p, t);
  }
  const t = Object.fromEntries(Object.entries(TARGETS).map(([k,v]) => [k, v*workDays]));
  return scoreBuilder(p, t);
}

function card(p){
  const onLeaveAll = (p.days > 0 && p.leaveDays >= p.days);
  const s = onLeaveAll ? null : scoreFor(p);
  const z = onLeaveAll ? "leave" : zone(s);
  const color = onLeaveAll ? "var(--neon-leave)" : ZONE_COLOR[z];
  const workDays = p.days - p.leaveDays;
  const kpis = p.role === "Closer"
    ? [["calls",p.calls],["mins",p.minutes],["pres",p.presentations],["deals",p.dealsClosed],["$new",Math.round(p.newUpfront)],["$fut",Math.round(p.futureUpfront)]]
    : [["calls",p.calls],["mins",p.minutes],["leads",p.leads],["disco",p.discoveries],["pres.b",p.presBooked],["pres.c",p.presCompleted]];
  return `<div class="card ${onLeaveAll?'leave':''}">
    <div class="card-top">
      <div><div class="card-name">${p.name}</div><div class="card-role">${p.role} · ${p.tl}</div></div>
      <div style="text-align:right">
        <div class="card-score" style="color:${color};text-shadow:0 0 12px ${color}">${onLeaveAll?'—':s+'%'}</div>
        <div class="card-badge" style="color:${color};border-color:${color}">${onLeaveAll?'On Leave':CARD_LABEL[z]}</div>
      </div>
    </div>
    <div class="kpis">
      ${kpis.map(([l,v]) => `<div class="kpi"><div class="kpi-val">${v}</div><div class="kpi-lbl">${l}</div></div>`).join("")}
    </div>
    <div class="attend">
      Attendance: <b style="color:var(--text)">${workDays}</b>/${p.days} days present
      ${p.leaveDays>0 ? `· <span class="leave-tag">Leave: ${p.leaveDays}</span>` : ''}
    </div>
  </div>`;
}

const money = n => "$" + Math.round(n).toLocaleString();
const isFullyOnLeave = p => p.days > 0 && p.leaveDays >= p.days;

// One metric tile. `pct` drives the bar; pass null for a figure with no natural
// ceiling (revenue, say) and the bar is left off rather than faked.
function mstat(label, value, unit, note, color, pct){
  return `<div class="mstat" style="--stat-color:${color}">
    <div class="mstat-lbl">${label}</div>
    <div class="mstat-val">${value}${unit ? `<small>${unit}</small>` : ""}</div>
    <div class="mstat-foot">
      ${pct === null ? "" : `<div class="mstat-bar"><i style="width:${Math.max(0, Math.min(100, pct))}%"></i></div>`}
      <div class="mstat-note">${note}</div>
    </div>
  </div>`;
}

// The four tiles, from a teamTotals() roll-up plus a health score. Shared so the
// organisation banner and every team row cannot drift apart.
function metricTiles(health, t){
  const z = zone(health);
  return mstat("Health score", health, "%", CARD_LABEL[z], ZONE_COLOR[z], health)
       + mstat("Avg ticket size", t.admissions ? money(t.avgTicket) : "—", "",
               `${money(t.revenue)} total revenue`, "#40c4ff", null)
       + mstat("Admissions", t.admissions, "",
               `${money(t.newUpfront)} new · ${money(t.futureUpfront)} future`, ZONE_COLOR.green, null)
       + mstat("Pres → enrolment", t.presHeld ? t.convPct : "—", t.presHeld ? "%" : "",
               `${t.admissions} of ${t.presHeld} held`, t.convColor, t.convPct);
}

// Organisation health for each day in the range, for the banner's sparkline.
// Each day is scored on its own — a person's daily row against one day's target
// — and averaged over everyone, with anyone on leave that day counting as 0.
function orgHealthSeries(rows){
  const byDate = {};
  rows.forEach(r => { (byDate[r.date] = byDate[r.date] || []).push(r); });
  return Object.keys(byDate).sort().map(date => {
    const day = byDate[date];
    const total = day.reduce((s, r) => {
      if (_leaveSet.has(`${r.person_name}|${date}`)) return s;
      return s + scoreFor({
        role: r.role, days: 1,
        calls: r.calls, minutes: r.minutes, leads: r.leads, discoveries: r.discoveries,
        presBooked: r.pres_booked, presCompleted: r.pres_completed,
        presentations: r.presentations, dealsClosed: r.deals_closed,
      });
    }, 0);
    return { date, health: Math.round(total / day.length) };
  });
}

function sparkline(series, color){
  if (series.length < 2) return "";
  const W = 268, H = 76;
  const top = Math.max(100, ...series.map(s => s.health));
  const x = i => (i / (series.length - 1)) * W;
  const y = v => H - (v / top) * H;
  const line = series.map((s, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(s.health).toFixed(1)}`).join(" ");
  const short = d => new Date(d + "T12:00:00Z").toLocaleDateString("en-US", { timeZone:"UTC", month:"short", day:"2-digit" });
  return `<div class="org-trend">
    <div class="org-trend-lbl">Health score trend</div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Daily organisation health score">
      <path d="${line} L${W},${H} L0,${H} Z" fill="${color}" opacity="0.16"></path>
      <path d="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
    </svg>
    <div class="org-trend-axis"><span>${short(series[0].date)}</span><span>${short(series[series.length-1].date)}</span></div>
  </div>`;
}

// Organisation-wide banner above the team blocks — the same four figures each
// team lead is shown, computed over everyone in the current filter rather than
// per team. Deliberately not an average of the team averages: that would weight
// a six-person team the same as a twelve-person one.
function renderOrgSummary(people, rows){
  if (!people.length) return "";
  const present = people.filter(p => !isFullyOnLeave(p));
  const health = Math.round(people.reduce((s,p) => s + (isFullyOnLeave(p) ? 0 : scoreFor(p)), 0) / people.length);
  const color = ZONE_COLOR[zone(health)];
  const teamCount = new Set(people.map(p => p.tl)).size;

  return `<div class="org-block" style="--team-color:${color}">
    <div class="org-head">
      <div class="org-layout">
        <div>
          <div class="org-id">
            <div class="org-badge">ALL</div>
            <div>
              <div class="org-name">Organisation</div>
              <div class="org-sub">${teamCount} team${teamCount!==1?"s":""} · ${present.length} active · ${people.length} people</div>
            </div>
          </div>
          ${sparkline(orgHealthSeries(rows || []), color)}
        </div>
        <div class="mstat-grid">${metricTiles(health, teamTotals(people))}</div>
      </div>
    </div>
  </div>`;
}

function renderSummary(people, rows){
  const teams = ["Soham","Tejasvi","Mamta Das","Unassigned"];
  let html = renderOrgSummary(people, rows);
  teams.forEach(tl => {
    const members = people.filter(p => p.tl === tl).sort((a,b) => (a.role<b.role?-1:1) || 0);
    if (!members.length) return;
    const present = members.filter(p => !isFullyOnLeave(p));
    // Everyone on the roster counts toward the team average, including anyone
    // on leave for the whole period — they contribute 0, because cover for an
    // absent member is the team lead's responsibility. Matches the main
    // dashboard and the TV Board, which were showing a different number for
    // the same team on the same day.
    const avg = Math.round(members.reduce((s,p) => s + (isFullyOnLeave(p) ? 0 : scoreFor(p)), 0) / members.length);
    const z = zone(avg), color = ZONE_COLOR[z];
    const t = teamTotals(members);
    const full = TL_FULL_NAME[tl] || tl;
    // Derived figures, shown once the row is expanded. Per-person uses the
    // active headcount — dividing by people who were out all period would
    // understate what the team on the floor actually did.
    const per = present.length || 1;
    const detail = [
      ["Revenue per person", money(t.revenue / per)],
      ["Admissions per person", (t.admissions / per).toFixed(1)],
      ["Presentations held", t.presHeld],
      ["Future revenue share", t.revenue ? Math.round(t.futureUpfront / t.revenue * 100) + "%" : "—"],
    ];
    html += `<div class="team-block" style="--team-color:${color}">
      <div class="team-head">
        <div class="team-grid">
          <div class="team-id">
            <div class="team-avatar">${initials(full)}</div>
            <div>
              <div class="team-name">${full}</div>
              <div class="team-role"><span class="team-caret">▶</span> Team Lead</div>
            </div>
          </div>
          <div class="mstat-grid">${metricTiles(avg, t)}</div>
          <div class="team-rail">
            <div><b>${present.length}</b><span>active</span></div>
            <div><b style="font-size:15px;color:var(--muted)">${members.length}</b><span>on roster</span></div>
            <span class="rail-card">${CARD_LABEL[z]}</span>
          </div>
        </div>
      </div>
      <div class="team-body">
        <dl class="team-detail">
          ${detail.map(([k,v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join("")}
        </dl>
        <div class="cards">${members.map(card).join("")}</div>
      </div>
    </div>`;
  });
  return html;
}

// Snapshots store the short team-lead key; these are the names to show.
const TL_FULL_NAME = { "Soham": "Soham Bajpai", "Tejasvi": "Tejasvi Pathe", "Mamta Das": "Mamta Das" };
const initials = name => name.trim().split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase();

// Team-level roll-up behind the four header figures.
//   Avg ticket    = (new upfront + future upfront) / admissions
//   Admissions    = deals closed by the team's closers
//   Pres → Enrol  = admissions as a share of presentations HELD. Held is the
//                   closer-side count and the same stage the funnel converts
//                   from; builders' "presentations completed" is a separate
//                   attribution of the handoff and would give a different base.
function teamTotals(members){
  const t = { revenue:0, newUpfront:0, futureUpfront:0, admissions:0, presHeld:0, presCompleted:0 };
  members.forEach(p => {
    t.presCompleted += p.presCompleted || 0;   // builder-side, shown for reference only
    // Admissions, revenue and presentations held are all closer-side. A builder
    // row also carries a deal count for the deals they sourced, but never the
    // money or the presentation behind them — counting those too double-counted
    // the same enrolment and dragged the average ticket down against a revenue
    // figure that never included them.
    if (p.role !== "Closer") return;
    t.newUpfront    += p.newUpfront || 0;
    t.futureUpfront += p.futureUpfront || 0;
    t.admissions    += p.dealsClosed || 0;
    t.presHeld      += p.presentations || 0;
  });
  t.revenue   = t.newUpfront + t.futureUpfront;
  t.avgTicket = t.admissions ? t.revenue / t.admissions : 0;
  t.convPct   = t.presHeld ? Math.round(t.admissions / t.presHeld * 100) : 0;
  t.convColor = !t.presHeld ? "var(--muted)"
              : t.convPct >= 50 ? ZONE_COLOR.green
              : t.convPct >= 25 ? ZONE_COLOR.gold || "#ffd740"
              : ZONE_COLOR.red;
  return t;
}

function renderDaily(rows){
  const head = ["Date","Name","Role","TL","Calls","In","Out","Miss","Mins","Leads","Disco","Pres.B","Pres.C","Pres","Deals","Score","Status"];
  const body = rows.map(r => {
    const status = _leaveSet.has(`${r.person_name}|${r.date}`) ? `<span class="st-leave">Leave</span>`
      : `<span style="color:${ZONE_COLOR[r.zone]||'var(--text)'}">${r.score}%</span>`;
    return `<tr>
      <td>${r.date}</td><td class="name">${r.person_name}</td><td>${r.role}</td><td>${r.team_lead||'—'}</td>
      <td>${r.calls}</td><td>${r.inbound}</td><td>${r.outbound}</td><td>${r.missed}</td><td>${r.minutes}</td>
      <td>${r.leads}</td><td>${r.discoveries}</td><td>${r.pres_booked}</td><td>${r.pres_completed}</td>
      <td>${r.presentations}</td><td>${r.deals_closed}</td><td>${status}</td>
    </tr>`;
  }).join("");
  return `<table class="daily"><thead><tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table>`;
}

let _rawRows = [];   // last fetched range (unfiltered)
let _range = { start:"", end:"" };
let _leaveSet = new Set();   // "person_name|date" marked leave (from live attendance)

// Rebuild the Person dropdown from fetched data (preserve current selection)
function populatePersons(){
  const sel = document.getElementById("inp-person");
  const cur = sel.value;
  const names = [...new Set(_rawRows.map(r => r.person_name))].sort();
  sel.innerHTML = `<option value="all">All People</option>` +
    names.map(n => `<option value="${n}">${n}</option>`).join("");
  if ([...sel.options].some(o => o.value === cur)) sel.value = cur;
}

// Apply Role / Team / Person filters to cached rows and re-render (no refetch)
function applyAndRender(){
  const role   = document.getElementById("inp-role").value;
  const team   = document.getElementById("inp-team").value;
  const person = document.getElementById("inp-person").value;

  let rows = _rawRows.slice();
  if (role   !== "all") rows = rows.filter(r => r.role === role);
  if (team   !== "all") rows = rows.filter(r => (r.team_lead||"") === team);
  if (person !== "all") rows = rows.filter(r => r.person_name === person);

  const wd = weekdaysBetween(_range.start, _range.end);
  document.getElementById("status").textContent =
    `${rows.length} daily records · ${_range.start} → ${_range.end} · ${wd} weekdays`
    + (person !== "all" ? ` · ${person}` : "");

  if (!rows.length){
    document.getElementById("results").innerHTML = `<div class="empty">No saved data found for this filter/range.</div>`;
    document.getElementById("daily-wrap").innerHTML = "";
    document.getElementById("raw-section").style.display = "none";
    return;
  }
  // The raw rows go through too — the banner's sparkline needs a health score
  // per day, which the aggregated people no longer carry.
  document.getElementById("results").innerHTML = renderSummary(aggregate(rows), rows);
  document.getElementById("daily-wrap").innerHTML = renderDaily(rows);
  document.getElementById("raw-count").textContent = `raw saved data · ${rows.length} records`;
  document.getElementById("raw-section").style.display = "block";
}

async function load(){
  const start = document.getElementById("inp-start").value;
  const end   = document.getElementById("inp-end").value;
  if (!start || !end) return;
  const btn = document.getElementById("btn-gen");
  btn.disabled = true; btn.textContent = "Loading...";
  document.getElementById("status").textContent = "Loading saved data…";
  try {
    const [rows, leaveSet] = await Promise.all([ fetchRows(start, end), fetchLeaveSet(start, end) ]);
    _rawRows = rows; _leaveSet = leaveSet;
    _range = { start, end };
    populatePersons();
    applyAndRender();
  } catch(e){
    document.getElementById("status").textContent = "Error: " + e.message;
  } finally {
    btn.disabled = false; btn.textContent = "Generate";
  }
}

document.getElementById("btn-gen").onclick = load;
// Filter changes just re-render from cache — no server round-trip
["inp-role","inp-team","inp-person"].forEach(id =>
  document.getElementById(id).addEventListener("change", applyAndRender));
document.getElementById("toggle-daily").onclick = function(){
  const w = document.getElementById("daily-wrap");
  const open = w.classList.toggle("show");
  this.classList.toggle("open", open);
  document.getElementById("raw-label").textContent = (open ? "Hide" : "Show") + " daily breakdown";
};

// Team blocks open on click. Delegated, because renderSummary() replaces the
// whole results container on every filter change.
document.getElementById("results").addEventListener("click", e => {
  const head = e.target.closest(".team-head");
  if (head) head.parentElement.classList.toggle("open");
});

// Require Google login (same session as the main dashboard); bounce to / otherwise.
document.body.style.visibility = "hidden";
_auth.auth.getSession().then(async ({ data: { session } }) => {
  await APP_USERS_READY;
  const email = session?.user?.email || "";
  if (session?.user && ALLOWED_EMAILS.includes(email) && isPageAllowed(email, window.location.pathname)) {
    document.body.style.visibility = "";
    buildNav(email);
    setPreset("yesterday");
    load();
  } else {
    window.location.replace("/");
  }
});
</script>
